name: Build & Push Docker image (dev/prod)

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: dockerhub-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: moskowpsix/pay-service-frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_TAG=prod" >> "$GITHUB_OUTPUT"
            echo "BUILD_ENV=production" >> "$GITHUB_OUTPUT"
          else
            echo "ENV_TAG=dev" >> "$GITHUB_OUTPUT"
            echo "BUILD_ENV=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "SHA_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ENV_TAG }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ENV_TAG }}-${{ steps.vars.outputs.SHA_TAG }}
          build-args: |
            BUILD_ENV=${{ steps.vars.outputs.BUILD_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    steps:
      - name: Compute deploy tag
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_TAG=prod" >> "$GITHUB_OUTPUT"
          else
            echo "ENV_TAG=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "SHA_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Swarm (service update via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_USER || secrets.DEV_SERVER_USER }}
          password: ${{ github.ref_name == 'main' && secrets.PROD_SERVER_PASSWORD || secrets.DEV_SERVER_PASSWORD }}
          port: ${{ github.ref_name == 'main' && (secrets.PROD_SERVER_PORT || 22) || (secrets.DEV_SERVER_PORT || 22) }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            # Уникальный тег с sha — Swarm всегда видит новый image ref
            DOCKER_IMAGE='${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ENV_TAG }}-${{ steps.vars.outputs.SHA_TAG }}'
            SWARM_SERVICE='${{ github.ref_name == 'main' && secrets.PROD_SERVICE_NAME || secrets.DEV_SERVICE_NAME }}'

            if [ -z "${SWARM_SERVICE}" ]; then
              echo "Missing secret: ${{ github.ref_name == 'main' && 'PROD_SERVICE_NAME' || 'DEV_SERVICE_NAME' }}"
              exit 1
            fi

            echo "Deploying image: ${DOCKER_IMAGE} to service: ${SWARM_SERVICE}"
            echo "Current service status:"
            docker service ps "${SWARM_SERVICE}" --no-trunc | head -n 5 || true

            echo "Updating service in background (detached mode)..."
            docker service update --with-registry-auth --force --detach --image "${DOCKER_IMAGE}" "${SWARM_SERVICE}" || {
              echo "Service update command failed"
              docker service ps "${SWARM_SERVICE}" --no-trunc | head -n 10
              exit 1
            }

            echo "Service update initiated successfully"
            echo "Update is running in background. Check service status manually:"
            echo "  docker service ps ${SWARM_SERVICE}"
